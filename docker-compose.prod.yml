# Production-oriented Compose overlay / standalone stack.
# Does not mount source, does not enable reload, runs API as non-root.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# Provide secrets via environment or an untracked env file (never commit keys).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vikingrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vikingrag}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vikingrag} -d ${POSTGRES_DB:-vikingrag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      VIKINGRAG_APP_ENV: production
      VIKINGRAG_APP_PROCESS_ROLE: migrate
      VIKINGRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vikingrag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vikingrag}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "10001:10001"
    environment:
      VIKINGRAG_APP_ENV: production
      VIKINGRAG_APP_DEBUG: "false"
      VIKINGRAG_APP_LOG_LEVEL: INFO
      VIKINGRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vikingrag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vikingrag}
      VIKINGRAG_REDIS_URL: redis://redis:6379/0
      VIKINGRAG_OBJECT_STORE_BACKEND: ${VIKINGRAG_OBJECT_STORE_BACKEND:-local}
      VIKINGRAG_OBJECT_STORE_LOCAL_ROOT: /app/data/object_store
      VIKINGRAG_OBJECT_STORE_S3_ENDPOINT: ${VIKINGRAG_OBJECT_STORE_S3_ENDPOINT:-}
      VIKINGRAG_OBJECT_STORE_S3_ACCESS_KEY: ${VIKINGRAG_OBJECT_STORE_S3_ACCESS_KEY:-}
      VIKINGRAG_OBJECT_STORE_S3_SECRET_KEY: ${VIKINGRAG_OBJECT_STORE_S3_SECRET_KEY:-}
      VIKINGRAG_OBJECT_STORE_S3_BUCKET: ${VIKINGRAG_OBJECT_STORE_S3_BUCKET:-vikingrag}
      VIKINGRAG_APP_PROCESS_ROLE: api
      VIKINGRAG_LLM_PROVIDER: ${VIKINGRAG_LLM_PROVIDER:?set real LLM provider}
      VIKINGRAG_LLM_API_KEY: ${VIKINGRAG_LLM_API_KEY:?}
      VIKINGRAG_LLM_MODEL: ${VIKINGRAG_LLM_MODEL:-}
      VIKINGRAG_LLM_BASE_URL: ${VIKINGRAG_LLM_BASE_URL:-}
      VIKINGRAG_EMBEDDING_PROVIDER: ${VIKINGRAG_EMBEDDING_PROVIDER:?set real embedding provider}
      VIKINGRAG_EMBEDDING_API_KEY: ${VIKINGRAG_EMBEDDING_API_KEY:?}
      VIKINGRAG_EMBEDDING_MODEL: ${VIKINGRAG_EMBEDDING_MODEL:-}
      VIKINGRAG_EMBEDDING_BASE_URL: ${VIKINGRAG_EMBEDDING_BASE_URL:-}
      VIKINGRAG_RETRIEVAL_ASSESSOR_PROVIDER: ${VIKINGRAG_RETRIEVAL_ASSESSOR_PROVIDER:?}
      VIKINGRAG_AUTH_ENABLED: "true"
      VIKINGRAG_AUTH_API_KEY: ${VIKINGRAG_AUTH_API_KEY:?}
      # Unrestricted when unset OR set to "*". Empty string = deny-all. Prefer omit or "*".
      VIKINGRAG_AUTH_ALLOWED_DOCUMENT_IDS: ${VIKINGRAG_AUTH_ALLOWED_DOCUMENT_IDS:-*}
      # Prefer sidecar edge-builder below (disable in-process to avoid double polling)
      VIKINGRAG_WORKERS_EDGE_BUILDER_ENABLED: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_object_store_prod:/app/data/object_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # No --reload, no source mounts
    command:
      [
        "uvicorn",
        "vikingrag.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    restart: unless-stopped

  # Algorithm-2 learning sidecar (use this OR in-process API worker, not both)
  edge-builder:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "10001:10001"
    environment:
      VIKINGRAG_APP_ENV: production
      VIKINGRAG_APP_PROCESS_ROLE: worker
      VIKINGRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vikingrag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vikingrag}
      VIKINGRAG_LLM_PROVIDER: ${VIKINGRAG_LLM_PROVIDER:?}
      VIKINGRAG_LLM_API_KEY: ${VIKINGRAG_LLM_API_KEY:?}
      VIKINGRAG_LLM_MODEL: ${VIKINGRAG_LLM_MODEL:-}
      VIKINGRAG_LLM_BASE_URL: ${VIKINGRAG_LLM_BASE_URL:-}
      VIKINGRAG_EMBEDDING_PROVIDER: ${VIKINGRAG_EMBEDDING_PROVIDER:?}
      VIKINGRAG_EMBEDDING_API_KEY: ${VIKINGRAG_EMBEDDING_API_KEY:?}
      VIKINGRAG_EMBEDDING_MODEL: ${VIKINGRAG_EMBEDDING_MODEL:-}
      VIKINGRAG_RETRIEVAL_SUPPORT_SELECTOR: ${VIKINGRAG_RETRIEVAL_SUPPORT_SELECTOR:-llm}
      VIKINGRAG_WORKERS_EDGE_BUILDER_POLL_SECONDS: "2.0"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "vikingrag.workers"]
    restart: unless-stopped

volumes:
  postgres_data_prod:
  api_object_store_prod:
