name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest tests/unit tests/evaluation -q

      - name: Offline evaluation smoke
        run: uv run vikingrag-eval smoke --offline

  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vikingrag
          POSTGRES_PASSWORD: vikingrag
          POSTGRES_DB: vikingrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vikingrag -d vikingrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VIKINGRAG_DATABASE_URL: postgresql+asyncpg://vikingrag:vikingrag@localhost:5432/vikingrag
      VIKINGRAG_REDIS_URL: redis://localhost:6379/0
      VIKINGRAG_APP_ENV: test
      VIKINGRAG_INTEGRATION_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Alembic upgrade
        run: uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest tests/integration -q -m integration
