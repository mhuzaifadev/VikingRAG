repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Use the project venv (same as `make typecheck`). The mirrors-mypy hook
  # runs in an isolated env and misses fastapi/uvicorn/etc.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
