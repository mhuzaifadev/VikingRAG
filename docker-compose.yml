services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vikingrag
      POSTGRES_PASSWORD: vikingrag
      POSTGRES_DB: vikingrag
    ports:
     - "5432:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikingrag -d vikingrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
     - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vikingrag
      MINIO_ROOT_PASSWORD: vikingragsecret
    ports:
     - "9000:9000"
     - "9001:9001"
    volumes:
     - minio_data:/data
    # MinIO for S3-compatible adapter (VIKINGRAG_OBJECT_STORE_BACKEND=s3).
    # Official image lacks curl/mc by default - no healthcheck.

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
     - .env.example
    environment:
      VIKINGRAG_APP_ENV: development
      VIKINGRAG_APP_DEBUG: "true"
      VIKINGRAG_DATABASE_URL: postgresql+asyncpg://vikingrag:vikingrag@postgres:5432/vikingrag
      VIKINGRAG_REDIS_URL: redis://redis:6379/0
      VIKINGRAG_OBJECT_STORE_BACKEND: local
      VIKINGRAG_OBJECT_STORE_LOCAL_ROOT: /app/data/object_store
      VIKINGRAG_OBJECT_STORE_S3_ENDPOINT: http://minio:9000
      VIKINGRAG_OBJECT_STORE_S3_ACCESS_KEY: vikingrag
      VIKINGRAG_OBJECT_STORE_S3_SECRET_KEY: vikingragsecret
      VIKINGRAG_OBJECT_STORE_S3_BUCKET: vikingrag
    ports:
     - "8000:8000"
    volumes:
     - ./src:/app/src
     - ./migrations:/app/migrations
     - api_object_store:/app/data/object_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn vikingrag.api.app:create_app --factory --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  minio_data:
  api_object_store:
